name: DISH V9 - Deploy Public Evolution Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dish-malware-ai-v9-arms-race/index.html'
      - '.github/workflows/dish-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dish-v9-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload DISH V9 website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dish-malware-ai-v9-arms-race
      - id: deployment
        name: Publish website
        uses: actions/deploy-pages@v4
